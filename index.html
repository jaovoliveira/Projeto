<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus Atlas VR - Lobby</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* ==============================
           TELA DE ENTRADA
        ============================== */

        #intro {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #163c59,
                    #05090e 80%
                );

        }

        #introBox {

            width: min(90%, 650px);

            padding: 55px 40px;

            border-radius: 25px;

            background:
                rgba(10, 18, 28, 0.95);

            border:
                1px solid rgba(255,255,255,0.15);

            box-shadow:
                0 30px 100px rgba(0,0,0,.8);

        }

        #logo {

            font-size: 55px;

            font-weight: bold;

            letter-spacing: 7px;

            margin-bottom: 10px;

            background:
                linear-gradient(
                    90deg,
                    #42b9ff,
                    #ffffff,
                    #61ffd0
                );

            -webkit-background-clip: text;

            color: transparent;

        }

        #subtitle {

            font-size: 16px;

            letter-spacing: 4px;

            opacity: .65;

            margin-bottom: 35px;

        }

        #description {

            font-size: 17px;

            line-height: 1.7;

            opacity: .9;

        }

        #enterVR {

            margin-top: 30px;

            padding: 17px 40px;

            border: none;

            border-radius: 12px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #087ef5,
                    #18c9ff
                );

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;

        }

        #enterVR:hover {

            transform:
                scale(1.04);

        }

    </style>

</head>


<body>


<!-- =====================================================
     INTRODUÇÃO
===================================================== -->

<div id="intro">

    <div id="introBox">

        <div id="logo">
            NEXUS ATLAS
        </div>

        <div id="subtitle">
            AMBIENTE DE REALIDADE VIRTUAL
        </div>

        <div id="description">

            Bem-vindo ao ambiente virtual
            do projeto Nexus Atlas.

            <br><br>

            Você está prestes a entrar
            no lobby de testes.

            <br><br>

            Coloque o headset e utilize
            os controles para explorar o ambiente.

        </div>

        <button id="enterVR">

            🥽 ENTRAR NO MODO VR

        </button>

    </div>

</div>


<!-- =====================================================
     CENA VR
===================================================== -->

<a-scene

    renderer="
        antialias: true;
        colorManagement: true;
        physicallyCorrectLights: true;
    "

    background="
        color: #111820
    "

    shadow="
        type: pcfsoft
    ">


    <!-- =================================================
         LUZ AMBIENTE
    ================================================== -->

    <a-light

        type="ambient"

        intensity="0.65"

        color="#dcecff">

    </a-light>


    <!-- =================================================
         LUZ PRINCIPAL
    ================================================== -->

    <a-light

        type="point"

        position="0 4 0"

        intensity="3"

        distance="15"

        color="#ffffff"

        cast-shadow="true">

    </a-light>


    <!-- =================================================
         LUZ AZUL DECORATIVA
    ================================================== -->

    <a-light

        type="point"

        position="-5 2 -4"

        intensity="2"

        distance="8"

        color="#168cff">

    </a-light>


    <!-- =================================================
         CHÃO
    ================================================== -->

    <a-box

        id="floor"

        position="0 -0.15 0"

        width="14"

        height="0.3"

        depth="14"

        color="#252c35"

        shadow="receive: true">

    </a-box>


    <!-- =================================================
         TETO
    ================================================== -->

    <a-box

        position="0 5 0"

        width="14"

        height="0.3"

        depth="14"

        color="#202731"

        shadow="receive: true">

    </a-box>


    <!-- =================================================
         PAREDE TRASEIRA
    ================================================== -->

    <a-box

        position="0 2.5 -7"

        width="14"

        height="5"

        depth="0.3"

        color="#343c47"

        shadow="cast: true">

    </a-box>


    <!-- =================================================
         PAREDE ESQUERDA
    ================================================== -->

    <a-box

        position="-7 2.5 0"

        width="0.3"

        height="5"

        depth="14"

        color="#303943"

        shadow="cast: true">

    </a-box>


    <!-- =================================================
         PAREDE DIREITA
    ================================================== -->

    <a-box

        position="7 2.5 0"

        width="0.3"

        height="5"

        depth="14"

        color="#303943"

        shadow="cast: true">

    </a-box>


    <!-- =================================================
         PAREDE DA FRENTE
         
         Mantemos uma abertura visual,
         mas o jogador continua limitado.
    ================================================== -->

    <a-box

        position="0 2.5 7"

        width="14"

        height="5"

        depth="0.3"

        color="#343c47"

        shadow="cast: true">

    </a-box>


    <!-- =================================================
         PAINEL NEXUS ATLAS
    ================================================== -->

    <a-box

        position="0 2.8 -6.75"

        width="6"

        height="2.4"

        depth="0.15"

        color="#111820">

    </a-box>


    <a-text

        value="NEXUS ATLAS"

        align="center"

        width="7"

        color="#55c8ff"

        position="0 3.2 -6.9">

    </a-text>


    <a-text

        value="REALIDADE VIRTUAL"

        align="center"

        width="4"

        color="#ffffff"

        position="0 2.65 -6.9">

    </a-text>


    <a-text

        value="LOBBY DE TESTES"

        align="center"

        width="3"

        color="#76ffd3"

        position="0 2.25 -6.9">

    </a-text>


    <!-- =================================================
         MESA CENTRAL
    ================================================== -->

    <a-box

        position="0 0.9 -2"

        width="4"

        height="0.25"

        depth="2"

        color="#171b20"

        shadow="cast: true">

    </a-box>


    <!-- PÉS DA MESA -->

    <a-box
        position="-1.6 0.45 -2.7"
        width="0.2"
        height="0.9"
        depth="0.2"
        color="#111111">
    </a-box>


    <a-box
        position="1.6 0.45 -2.7"
        width="0.2"
        height="0.9"
        depth="0.2"
        color="#111111">
    </a-box>


    <a-box
        position="-1.6 0.45 -1.3"
        width="0.2"
        height="0.9"
        depth="0.2"
        color="#111111">
    </a-box>


    <a-box
        position="1.6 0.45 -1.3"
        width="0.2"
        height="0.9"
        depth="0.2"
        color="#111111">
    </a-box>


    <!-- =================================================
         OBJETO DE TESTE
    ================================================== -->

    <a-box

        position="0 1.35 -2"

        width="1.2"

        height="0.7"

        depth="0.8"

        color="#168cff"

        animation="
            property: rotation;
            to: 0 360 0;
            dur: 6000;
            easing: linear;
            loop: true;
        ">

    </a-box>


    <!-- =================================================
         ILUMINAÇÃO NO CHÃO
    ================================================== -->

    <a-box

        position="0 0.02 -6.5"

        width="8"

        height="0.04"

        depth="0.08"

        color="#159cff">

    </a-box>


    <a-box

        position="-6.5 0.02 0"

        width="0.08"

        height="0.04"

        depth="8"

        color="#159cff">

    </a-box>


    <a-box

        position="6.5 0.02 0"

        width="0.08"

        height="0.04"

        depth="8"

        color="#159cff">

    </a-box>


    <!-- =================================================
         JOGADOR
    ================================================== -->

    <a-entity

        id="player"

        position="0 0 4">


        <!-- CÂMERA -->

        <a-camera

            id="camera"

            position="0 1.6 0"

            look-controls="
                pointerLockEnabled: false;
                magicWindowTrackingEnabled: true;
            ">

        </a-camera>


        <!-- CONTROLE ESQUERDO -->

        <a-entity

            id="leftController"

            laser-controls="hand: left"

            raycaster="
                objects: .interactable;
                far: 5;
            ">

        </a-entity>


        <!-- CONTROLE DIREITO -->

        <a-entity

            id="rightController"

            laser-controls="hand: right"

            raycaster="
                objects: .interactable;
                far: 5;
            ">

        </a-entity>


    </a-entity>


</a-scene>


<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const scene =
    document.querySelector("a-scene");

const player =
    document.querySelector("#player");

const intro =
    document.querySelector("#intro");

const enterVR =
    document.querySelector("#enterVR");


/* =====================================================
   ENTRAR NO VR
===================================================== */

enterVR.addEventListener(
    "click",
    async () => {

        intro.style.display =
            "none";

        try {

            await scene.enterVR();

        } catch (error) {

            console.log(
                "VR não iniciado:",
                error
            );

        }

    }
);


/* =====================================================
   QUANDO ENTRAR NO VR
===================================================== */

scene.addEventListener(
    "enter-vr",
    () => {

        intro.style.display =
            "none";

        console.log(
            "Nexus Atlas: VR iniciado."
        );

    }
);


/* =====================================================
   GAMEPADS
===================================================== */

function getGamepads() {

    if (!navigator.getGamepads) {

        return [];

    }

    return Array.from(
        navigator.getGamepads()
    ).filter(
        gamepad =>
            gamepad &&
            gamepad.connected
    );

}


/* =====================================================
   DEADZONE
===================================================== */

function deadzone(value) {

    const limite =
        0.15;

    if (
        Math.abs(value)
        < limite
    ) {

        return 0;

    }

    return value;

}


/* =====================================================
   MOVIMENTO
===================================================== */

const speed =
    0.055;

const rotationSpeed =
    0.035;


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function updateMovement() {

    const gamepads =
        getGamepads();


    let left =
        null;

    let right =
        null;


    /*
       Tentamos identificar
       os controles pela mão.
    */

    gamepads.forEach(
        gamepad => {

            if (
                gamepad.hand === "left"
            ) {

                left =
                    gamepad;

            }

            if (
                gamepad.hand === "right"
            ) {

                right =
                    gamepad;

            }

        }
    );


    /*
       Caso o navegador não informe
       qual é cada mão.
    */

    if (
        !left &&
        gamepads.length > 0
    ) {

        left =
            gamepads[0];

    }


    if (
        !right &&
        gamepads.length > 1
    ) {

        right =
            gamepads[1];

    }


    /* =================================================
       ANALÓGICO ESQUERDO
       
       ANDAR
    ================================================= */

    if (left) {

        /*
           Na maioria dos controles VR:

           axes[2] = horizontal
           axes[3] = vertical
        */

        let x =
            deadzone(
                left.axes[2] ??
                left.axes[0] ??
                0
            );

        let y =
            deadzone(
                left.axes[3] ??
                left.axes[1] ??
                0
            );


        const rotation =
            player.object3D.rotation.y;


        /*
           Frente / trás
        */

        const forwardX =
            -Math.sin(rotation)
            * y
            * speed;


        const forwardZ =
            -Math.cos(rotation)
            * y
            * speed;


        /*
           Movimento lateral
        */

        const strafeX =
            Math.cos(rotation)
            * x
            * speed;


        const strafeZ =
            -Math.sin(rotation)
            * x
            * speed;


        /*
           Nova posição
        */

        const novaX =
            player.object3D.position.x
            +
            forwardX
            +
            strafeX;


        const novaZ =
            player.object3D.position.z
            +
            forwardZ
            +
            strafeZ;


        /* =================================================
           LIMITES DO LOBBY
        ================================================= */

        const limite =
            6.25;


        /*
           Não permite atravessar
           as paredes.
        */

        if (
            novaX > -limite &&
            novaX < limite
        ) {

            player.object3D.position.x =
                novaX;

        }


        if (
            novaZ > -limite &&
            novaZ < limite
        ) {

            player.object3D.position.z =
                novaZ;

        }

    }


    /* =================================================
       ANALÓGICO DIREITO
       
       GIRAR
    ================================================= */

    if (right) {

        let rotation =
            deadzone(
                right.axes[2] ??
                right.axes[0] ??
                0
            );


        player.object3D.rotation.y -=
            rotation *
            rotationSpeed;

    }


    requestAnimationFrame(
        updateMovement
    );

}


updateMovement();


/* =====================================================
   PULO
===================================================== */

let verticalVelocity =
    0;

let grounded =
    true;


function jump() {

    if (!grounded) {

        return;

    }

    grounded =
        false;

    verticalVelocity =
        0.18;

}


function updateJump() {

    verticalVelocity -=
        0.012;


    player.object3D.position.y +=
        verticalVelocity;


    if (
        player.object3D.position.y
        <= 0
    ) {

        player.object3D.position.y =
            0;

        verticalVelocity =
            0;

        grounded =
            true;

    }


    requestAnimationFrame(
        updateJump
    );

}


updateJump();


/* =====================================================
   BOTÃO DE PULO
===================================================== */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.code === "Space"
        ) {

            jump();

        }

    }
);


/* =====================================================
   GAMEPAD BUTTON
===================================================== */

window.addEventListener(
    "gamepadconnected",
    event => {

        console.log(
            "Controle VR conectado:",
            event.gamepad
        );

    }
);


console.log(
    "Nexus Atlas VR Lobby carregado."
);

</script>

</body>

</html>
