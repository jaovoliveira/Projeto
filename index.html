<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador do Braço Robótico</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 1.2rem;
      pointer-events: none;
    }
  </style>
  <!-- Importação do Three.js e loaders via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading">Carregando braço robótico...</div>
  <div id="canvas-container"></div>

  <script>
    // 1. Configuração da Cena, Câmera e Renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e24);

    const camera = new THREE.PerspectiveCamera(
      45, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 2. Controle de Câmera (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 3. Iluminação
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight1.position.set(10, 20, 15);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x90e0ef, 0.5);
    dirLight2.position.set(-10, -10, -10);
    scene.add(dirLight2);

    // 4. Grade de Chão Virtual (Substitui a mesa visualmente de forma limpa)
    const gridHelper = new THREE.GridHelper(20, 20, 0x00b4d8, 0x48cae4);
    scene.add(gridHelper);

    // 5. Carregamento do Arquivo GLB do Braço Robótico
    const loader = new THREE.GLTFLoader();
    
    // Nome exato do seu arquivo GLB local (ajuste se o seu arquivo tiver outro nome)
    const NOME_DO_ARQUIVO = 'braco_robotico.glb'; 

    loader.load(
      NOME_DO_ARQUIVO,
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // --- ENQUADRAMENTO AUTOMÁTICO DA CÂMERA ---
        // Calcula a caixa delimitadora do modelo para centralizar a câmera
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        // Reposiciona o chão de grade para ficar logo abaixo da base do robô
        gridHelper.position.y = box.min.y;

        // Ajusta os controles e a câmera com base no tamanho do robô
        const maxDim = Math.max(size.x, size.y, size.z);
        const fov = camera.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.5;

        camera.position.set(center.x + cameraZ * 0.5, center.y + cameraZ * 0.5, center.z + cameraZ);
        controls.target.copy(center);
        controls.update();

        // Esconde a mensagem de carregamento
        document.getElementById('loading').style.display = 'none';
      },
      (xhr) => {
        // Progresso do carregamento
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('loading').innerText = `Carregando braço robótico: ${percent}%`;
        }
      },
      (error) => {
        console.error('Erro ao carregar o arquivo GLB:', error);
        document.getElementById('loading').innerText = 'Erro ao carregar o arquivo .glb. Verifique o nome do arquivo na mesma pasta.';
      }
    );

    // 6. Redimensionamento da Janela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Loop de Animação
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
