<script>

/* =====================================================
   REFERÊNCIAS
===================================================== */

const cena = document.querySelector("a-scene");

const player = document.querySelector("#player");

const camera = document.querySelector("#camera");

const esquerda =
    document.querySelector("#controleEsquerdo");

const direita =
    document.querySelector("#controleDireito");


/* =====================================================
   TELA INICIAL
===================================================== */

const inicio =
    document.querySelector("#inicio");

const botaoVR =
    document.querySelector("#entrarVR");


botaoVR.addEventListener("click", async () => {

    inicio.style.display = "none";

    try {

        if (cena.enterVR) {

            await cena.enterVR();

        }

    } catch (erro) {

        console.log(
            "VR não disponível:",
            erro
        );

    }

});


cena.addEventListener("enter-vr", () => {

    inicio.style.display = "none";

});


/* =====================================================
   MOVIMENTAÇÃO MANUAL
=====================================================

   IMPORTANTE:

   Não usamos movement-controls.

   O jogador só se movimenta quando
   o analógico realmente é movimentado.
===================================================== */

const velocidade = 0.08;

const velocidadeRotacao = 1.5;


function atualizarMovimento() {

    if (!esquerda.object3D) {

        requestAnimationFrame(
            atualizarMovimento
        );

        return;

    }


    /*
     * A-Frame registra os eixos do
     * controle através de axis.
     */

    const eixo =
        esquerda.components[
            "tracked-controls"
        ];


    /*
     * Alguns controles utilizam
     * thumbstick- events.
     */

    const joystick =
        esquerda.components[
            "tracked-controls"
        ];


    /*
     * Leitura direta do gamepad.
     */

    const gamepads =
        navigator.getGamepads
        ? navigator.getGamepads()
        : [];


    let controle = null;


    for (let i = 0; i < gamepads.length; i++) {

        if (
            gamepads[i] &&
            gamepads[i].connected
        ) {

            controle = gamepads[i];

            break;

        }

    }


    if (controle) {

        const x =
            controle.axes[2] ||
            controle.axes[0] ||
            0;

        const y =
            controle.axes[3] ||
            controle.axes[1] ||
            0;


        /*
         * DEADZONE
         *
         * Evita que o personagem
         * ande sozinho quando o
         * analógico está levemente
         * deslocado.
         */

        const deadzone = 0.15;


        const movimentoX =
            Math.abs(x) > deadzone
            ? x
            : 0;


        const movimentoY =
            Math.abs(y) > deadzone
            ? y
            : 0;


        /*
         * DIREÇÃO DA CÂMERA
         */

        const rotacao =
            camera.object3D.rotation.y;


        /*
         * Movimento para frente/trás
         */

        const frenteX =
            -Math.sin(rotacao) *
            movimentoY *
            velocidade;


        const frenteZ =
            -Math.cos(rotacao) *
            movimentoY *
            velocidade;


        /*
         * Movimento lateral
         */

        const lateralX =
            Math.cos(rotacao) *
            movimentoX *
            velocidade;


        const lateralZ =
            -Math.sin(rotacao) *
            movimentoX *
            velocidade;


        player.object3D.position.x +=
            frenteX + lateralX;


        player.object3D.position.z +=
            frenteZ + lateralZ;

    }


    requestAnimationFrame(
        atualizarMovimento
    );

}


atualizarMovimento();


/* =====================================================
   ROTAÇÃO MANUAL
===================================================== */

function atualizarRotacao() {

    const gamepads =
        navigator.getGamepads
        ? navigator.getGamepads()
        : [];


    let controle = null;


    for (let i = 0; i < gamepads.length; i++) {

        if (
            gamepads[i] &&
            gamepads[i].connected
        ) {

            controle = gamepads[i];

            break;

        }

    }


    if (controle) {

        /*
         * Dependendo do headset,
         * os eixos podem variar.
         */

        const x =
            controle.axes[2] ||
            controle.axes[0] ||
            0;


        const deadzone = 0.18;


        if (
            Math.abs(x) >
            deadzone
        ) {

            player.object3D.rotation.y -=
                x *
                velocidadeRotacao *
                0.01;

        }

    }


    requestAnimationFrame(
        atualizarRotacao
    );

}


atualizarRotacao();

/* =====================================================
   INTERAÇÃO COM NPC
===================================================== */

function verificarNPCs() {

    const posicao =
        player.object3D.position;


    npcs.forEach(npc => {

        const posNPC =
            npc.elemento.object3D.position;


        const distancia =
            posicao.distanceTo(
                posNPC
            );


        /*
         * Se estiver perto do NPC
         */

        if (distancia < 4) {

            /*
             * Botão A / X
             * geralmente buttons[4]
             */

            const gamepads =
                navigator.getGamepads
                ? navigator.getGamepads()
                : [];


            for (
                let i = 0;
                i < gamepads.length;
                i++
            ) {

                const gamepad =
                    gamepads[i];


                if (
                    gamepad &&
                    gamepad.connected
                ) {

                    if (
                        gamepad.buttons[4] &&
                        gamepad.buttons[4].pressed
                    ) {

                        abrirDialogo(
                            npc
                        );

                    }

                }

            }

        }

    });


    requestAnimationFrame(
        verificarNPCs
    );

}


verificarNPCs();


</script>
