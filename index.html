<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ATLAS - Laboratório VR (SENAI São Carlos)</title>

  <!-- A-Frame 1.5.0 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Titillium Web', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
    }

    /* TELA DE ENTRADA (OVERLAY) */
    #intro-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .intro-card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 16px;
      padding: 35px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.2);
    }

    .badge-senai {
      display: inline-block;
      background: #005696;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .intro-card h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #06b6d4;
      margin-bottom: 5px;
    }

    .intro-card h2 {
      font-size: 1.1rem;
      color: #9ca3af;
      font-weight: 400;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .intro-card p {
      font-size: 1rem;
      line-height: 1.5;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    .btn-enter-vr {
      background: linear-gradient(135deg, #005696 0%, #0284c7 100%);
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Titillium Web', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
    }

    .btn-enter-vr:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.8);
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
    }

    .controls-guide {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .controls-guide div strong {
      color: #38bdf8;
      display: block;
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Esconde botões padrões do A-Frame que conflitam */
    .a-enter-vr {
      display: none !important;
    }
  </style>

  <script>
    // Componente de Movimento WASD / Controle VR
    AFRAME.registerComponent('nexus-movement-controller', {
      schema: {
        speed: { type: 'number', default: 0.06 },
        turnSpeed: { type: 'number', default: 0.035 }
      },
      init: function () {
        this.rig = this.el;
        this.camera = this.el.querySelector('a-camera');
        this.keys = {};
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      },
      tick: function (time, delta) {
        var dt = delta / 1000;
        if (isNaN(dt) || dt <= 0) return;

        var moveVector = { x: 0, z: 0 };
        var turnAmount = 0;

        // Gamepad (Óculos VR)
        var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < gamepads.length; i++) {
          var gp = gamepads[i];
          if (!gp || !gp.connected) continue;
          if (gp.handedness === 'left') {
            moveVector.x = gp.axes[2] || gp.axes[0] || 0;
            moveVector.z = gp.axes[3] || gp.axes[1] || 0;
          }
          if (gp.handedness === 'right') {
            turnAmount = gp.axes[2] || gp.axes[0] || 0;
          }
        }

        // Teclado PC
        if (this.keys['KeyW'] || this.keys['ArrowUp']) moveVector.z = -1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) moveVector.z = 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveVector.x = -1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) moveVector.x = 1;

        if (Math.abs(turnAmount) > 0.2) {
          var currentRot = this.rig.getAttribute('rotation');
          currentRot.y -= turnAmount * this.data.turnSpeed * 60;
          this.rig.setAttribute('rotation', currentRot);
        }

        if (Math.abs(moveVector.x) > 0.2 || Math.abs(moveVector.z) > 0.2) {
          var rigRot = this.rig.getAttribute('rotation');
          var camRot = this.camera ? this.camera.getAttribute('rotation') : { y: 0 };
          var totalAngleRad = (rigRot.y + camRot.y) * (Math.PI / 180);

          var dx = moveVector.x * Math.cos(totalAngleRad) + moveVector.z * Math.sin(totalAngleRad);
          var dz = moveVector.z * Math.cos(totalAngleRad) - moveVector.x * Math.sin(totalAngleRad);

          var pos = this.rig.getAttribute('position');
          pos.x += dx * this.data.speed;
          pos.z += dz * this.data.speed;

          // Limites da Sala
          pos.x = Math.max(-5.2, Math.min(5.2, pos.x));
          pos.z = Math.max(-5.2, Math.min(5.2, pos.z));

          this.rig.setAttribute('position', pos);
        }
      }
    });

    // Diagnóstico do modelo .GLB no console
    AFRAME.registerComponent('model-checker', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          console.log('✅ SUCESSO: O modelo braco_robotico.glb foi carregado!');
        });
        this.el.addEventListener('model-error', (e) => {
          console.error('❌ ERRO ao carregar braco_robotico.glb:', e.detail);
        });
      }
    });

    function enterExperience() {
      document.getElementById('intro-screen').classList.add('fade-out');
      var scene = document.querySelector('a-scene');
      if (scene && (AFRAME.utils.device.checkHeadsetConnected() || navigator.xr)) {
        scene.enterVR();
      }
    }
  </script>
</head>
<body>

  <!-- TELA INICIAL -->
  <div id="intro-screen">
    <div class="intro-card">
      <span class="badge-senai">SENAI SÃO CARLOS — MECATRÔNICA</span>
      <h1>NEXUS ATLAS</h1>
      <h2>LABORATÓRIO DE ROBÓTICA VR</h2>

      <p>
        Ambiente Virtual 3D interativo para simulação e teste do <strong>Braço Robótico (.GLB)</strong>.
      </p>

      <button class="btn-enter-vr" onclick="enterExperience()">
        🥽 ENTRAR NO LABORATÓRIO
      </button>

      <div class="controls-guide">
        <div><strong>TECLADO PC</strong>WASD + Mouse</div>
        <div><strong>ÓCULOS VR</strong>Analg. Esq: Andar | Dir: Girar</div>
        <div><strong>ARQUIVO 3D</strong>braco_robotico.glb</div>
      </div>
    </div>
  </div>

  <!-- CENA 3D (Com loading-screen desativado para não travar em tela azul) -->
  <a-scene 
    loading-screen="enabled: false"
    renderer="antialias: true; colorManagement: true; exposure: 1.0; toneMapping: ACESFilmic;"
    vr-mode-ui="enabled: true">

    <!-- CÂMERA E CONTROLES -->
    <a-entity id="cameraRig" position="0 0 3" nexus-movement-controller>
      <a-camera id="headCamera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false"></a-camera>
      <a-entity id="leftHand" oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
      <a-entity id="rightHand" oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- ILUMINAÇÃO -->
    <a-light type="ambient" color="#0f172a" intensity="1.2"></a-light>
    <a-light type="point" position="0 4.2 1.5" color="#e0f2fe" intensity="1.8" distance="12"></a-light>
    <a-light type="point" position="0 4.2 -2.5" color="#38bdf8" intensity="1.5" distance="12"></a-light>
    <a-light type="spot" position="0 4.4 0" target="#worktable" color="#ffffff" intensity="2.5" angle="45" penumbra="0.5"></a-light>

    <!-- PISO E TETO -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#111827" roughness="0.3" metalness="0.5"></a-plane>
    <a-grid position="0 0.01 0" width="12" height="12" cell-size="1" color-center="#06b6d4" color-grid="#1e293b"></a-grid>
    <a-plane position="0 4.8 0" rotation="90 0 0" width="12" height="12" color="#0f172a" side="double"></a-plane>

    <!-- PAREDES -->
    <a-plane position="0 2.4 -6" rotation="0 0 0" width="12" height="5" color="#1f2937"></a-plane>
    <a-plane position="0 2.4 6" rotation="0 180 0" width="12" height="5" color="#1f2937"></a-plane>
    <a-plane position="-6 2.4 0" rotation="0 90 0" width="12" height="5" color="#111827"></a-plane>
    <a-plane position="6 2.4 0" rotation="0 -90 0" width="12" height="5" color="#111827"></a-plane>

    <!-- PAINEL SENAI -->
    <a-entity position="0 2.8 -5.85">
      <a-box width="4.4" height="2.2" depth="0.1" color="#005696"></a-box>
      <a-text value="SENAI" align="center" position="0 0.4 0.07" width="12" color="#ffffff" font="roboto"></a-text>
      <a-text value="SAO CARLOS - MECATRONICA" align="center" position="0 -0.2 0.07" width="5" color="#38bdf8" font="roboto"></a-text>
      <a-text value="PROJETO NEXUS ATLAS" align="center" position="0 -0.5 0.07" width="4" color="#e0f2fe" font="roboto"></a-text>
    </a-entity>

    <!-- MESA E BRAÇO ROBÓTICO -->
    <a-entity id="worktable" position="0 0 0">
      <!-- Tampo da Mesa -->
      <a-box position="0 0.85 0" width="2.4" height="0.1" depth="1.4" color="#1e293b" roughness="0.3" metalness="0.7"></a-box>
      <a-box position="0 0.86 0" width="2.2" height="0.09" depth="1.2" color="#0f172a"></a-box>

      <!-- Pés da Mesa -->
      <a-box position="-1.0 0.4 -0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="1.0 0.4 -0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="-1.0 0.4 0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="1.0 0.4 0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>

      <!-- MODELO 3D .GLB DO BRAÇO ROBÓTICO -->
      <a-gltf-model 
        src="braco_robotico.glb" 
        position="0 0.9 0" 
        rotation="0 0 0" 
        scale="1 1 1"
        model-checker>
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
