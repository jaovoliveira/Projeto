<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador do Braço Robótico</title>
  
  <!-- Carrega o componente Web <model-viewer> (trata o arquivo local de forma segura) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #1a1a1e;
      --poster-color: transparent;
    }

    .info-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 10;
    }

    .controls-hint {
      position: absolute;
      bottom: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #a0a0a0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="info-badge">
    🤖 <strong>Projeto TCC:</strong> Braço Robótico 3D
  </div>

  <div class="controls-hint">
    🖱️ Clique e arraste para girar | Scroll para zoom | Botão direito para mover
  </div>

  <!-- Componente 3D com enquadramento, iluminação e sombras automáticas -->
  <model-viewer 
    id="robot-viewer"
    src="barco_robotico.glb" 
    alt="Modelo 3D do Braço Robótico" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1.5"
    shadow-softness="0.8"
    exposure="1.0"
    interaction-prompt="auto"
    ar>
  </model-viewer>

  <script>
    // Correção para leitura de arquivos locais (evita travamento por CORS)
    const viewer = document.getElementById('robot-viewer');

    // Se o navegador barrar o carregamento direto por protocolo file://,
    // convertemos o arquivo local em um Blob automaticamente.
    fetch('barco_robotico.glb')
      .then(response => {
        if (!response.ok) throw new Error('Erro na rede');
        return response.blob();
      })
      .then(blob => {
        const objectURL = URL.createObjectURL(blob);
        viewer.src = objectURL;
      })
      .catch(err => {
        console.log('Tentando modo de compatibilidade direta...');
      });
  </script>

</body>
</html>
