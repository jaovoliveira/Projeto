<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ATLAS - Laboratório VR (SENAI São Carlos)</title>

  <!-- Biblioteca A-Frame para WebXR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Google Fonts: Titillium Web -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Titillium Web', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
    }

    #intro-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      backdrop-filter: blur(10px);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .intro-card {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 16px;
      padding: 40px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(6, 182, 212, 0.15);
      position: relative;
      overflow: hidden;
    }

    .intro-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #005696 0%, #06b6d4 50%, #005696 100%);
    }

    .badge-senai {
      display: inline-block;
      background: #005696;
      color: #ffffff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 86, 150, 0.5);
    }

    .intro-card h1 {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .intro-card h2 {
      font-size: 1.2rem;
      color: #9ca3af;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .intro-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 30px;
      text-align: justify;
      text-align-last: center;
    }

    .btn-enter-vr {
      background: linear-gradient(135deg, #005696 0%, #0284c7 100%);
      color: #ffffff;
      border: 1px solid #38bdf8;
      padding: 18px 36px;
      font-size: 1.3rem;
      font-weight: 700;
      font-family: 'Titillium Web', sans-serif;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .btn-enter-vr:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 35px rgba(6, 182, 212, 0.7);
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
    }

    .controls-guide {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .controls-guide div strong {
      color: #38bdf8;
      display: block;
      margin-bottom: 4px;
    }

    .fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .a-enter-vr {
      display: none !important;
    }
  </style>

  <script>
    // Componente de Movimento Manual (Teclado/VR)
    AFRAME.registerComponent('nexus-movement-controller', {
      schema: {
        speed: { type: 'number', default: 0.06 },
        turnSpeed: { type: 'number', default: 0.035 },
        deadzone: { type: 'number', default: 0.2 },
        boundsX: { type: 'array', default: [-5.4, 5.4] },
        boundsZ: { type: 'array', default: [-5.4, 5.4] }
      },

      init: function () {
        this.rig = this.el;
        this.camera = this.el.querySelector('a-camera') || this.el.querySelector('[camera]');
        this.keys = {};
        window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
        window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
      },

      tick: function (time, delta) {
        var dt = delta / 1000;
        if (isNaN(dt) || dt <= 0) return;

        var moveVector = { x: 0, z: 0 };
        var turnAmount = 0;

        var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (var i = 0; i < gamepads.length; i++) {
          var gp = gamepads[i];
          if (!gp || !gp.connected) continue;

          if (gp.handedness === 'left') {
            var ax = (gp.axes[2] !== undefined && Math.abs(gp.axes[2]) > 0.01) ? gp.axes[2] : (gp.axes[0] || 0);
            var ay = (gp.axes[3] !== undefined && Math.abs(gp.axes[3]) > 0.01) ? gp.axes[3] : (gp.axes[1] || 0);
            if (Math.hypot(ax, ay) > this.data.deadzone) {
              moveVector.x = ax;
              moveVector.z = ay;
            }
          }

          if (gp.handedness === 'right') {
            var rx = (gp.axes[2] !== undefined && Math.abs(gp.axes[2]) > 0.01) ? gp.axes[2] : (gp.axes[0] || 0);
            if (Math.abs(rx) > this.data.deadzone) {
              turnAmount = rx;
            }
          }
        }

        if (this.keys['KeyW'] || this.keys['ArrowUp']) moveVector.z = -1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) moveVector.z = 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) moveVector.x = -1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) moveVector.x = 1;

        if (Math.abs(turnAmount) > 0) {
          var currentRot = this.rig.getAttribute('rotation');
          currentRot.y -= turnAmount * this.data.turnSpeed * 60;
          this.rig.setAttribute('rotation', currentRot);
        }

        if (moveVector.x !== 0 || moveVector.z !== 0) {
          var len = Math.hypot(moveVector.x, moveVector.z);
          if (len > 1) {
            moveVector.x /= len;
            moveVector.z /= len;
          }

          var rigRot = this.rig.getAttribute('rotation');
          var camRot = this.camera ? this.camera.getAttribute('rotation') : { y: 0 };
          var totalAngleRad = (rigRot.y + camRot.y) * (Math.PI / 180);

          var dx = moveVector.x * Math.cos(totalAngleRad) + moveVector.z * Math.sin(totalAngleRad);
          var dz = moveVector.z * Math.cos(totalAngleRad) - moveVector.x * Math.sin(totalAngleRad);

          var pos = this.rig.getAttribute('position');
          var targetX = pos.x + dx * this.data.speed;
          var targetZ = pos.z + dz * this.data.speed;

          pos.x = Math.max(this.data.boundsX[0], Math.min(this.data.boundsX[1], targetX));
          pos.z = Math.max(this.data.boundsZ[0], Math.min(this.data.boundsZ[1], targetZ));

          this.rig.setAttribute('position', pos);
        }
      }
    });

    // Gerador dinâmico de textura SENAI
    AFRAME.registerComponent('senai-texture-generator', {
      init: function () {
        var canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');

        ctx.fillStyle = '#005696';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 12;
        ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 4;
        ctx.strokeRect(45, 45, canvas.width - 90, canvas.height - 90);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(80, 240, 120, 10);
        ctx.fillRect(canvas.width - 200, 240, 120, 10);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 120px "Titillium Web", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SENAI', canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = '600 28px "Titillium Web", sans-serif';
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('SÃO CARLOS • MECATRÔNICA', canvas.width / 2, canvas.height / 2 + 70);

        ctx.font = '400 20px "Titillium Web", sans-serif';
        ctx.fillStyle = '#e0f2fe';
        ctx.fillText('PROJETO NEXUS ATLAS — AMBIENTE DE TESTE VR', canvas.width / 2, canvas.height / 2 + 110);

        var texture = new THREE.CanvasTexture(canvas);
        var mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
      }
    });

    function enterExperience() {
      var introScreen = document.getElementById('intro-screen');
      introScreen.classList.add('fade-out');
      var scene = document.querySelector('a-scene');
      if (scene) {
        if (scene.hasLoaded) {
          tryEnterVR(scene);
        } else {
          scene.addEventListener('loaded', function () {
            tryEnterVR(scene);
          });
        }
      }
    }

    function tryEnterVR(scene) {
      if (AFRAME.utils.device.checkHeadsetConnected() || navigator.xr) {
        scene.enterVR();
      }
    }
  </script>
</head>
<body>

  <!-- OVERLAY TELA INICIAL -->
  <div id="intro-screen">
    <div class="intro-card">
      <span class="badge-senai">SENAI SÃO CARLOS — MECATRÔNICA</span>
      <h1>NEXUS ATLAS</h1>
      <h2>SISTEMA DE MANIPULAÇÃO ROBÓTICA EM VR</h2>

      <p>
        Laboratório Virtual de testes. O modelo do <strong>Braço Robótico (.GLB)</strong> já está carregado sobre a mesa central de testes.
      </p>

      <button class="btn-enter-vr" onclick="enterExperience()">
        <span>🥽</span> ENTRAR NO MODO VR
      </button>

      <div class="controls-guide">
        <div>
          <strong>CONTROLES VR</strong>
          Esq: Andar | Dir: Virar
        </div>
        <div>
          <strong>TECLADO PC</strong>
          Teclas WASD + Mouse
        </div>
        <div>
          <strong>MODELO 3D</strong>
          braco_robotico.glb
        </div>
      </div>
    </div>
  </div>

  <!-- CENA 3D A-FRAME -->
  <a-scene 
    renderer="antialias: true; colorManagement: true; exposure: 1.0; toneMapping: ACESFilmic;"
    vr-mode-ui="enabled: true">

    <!-- CARREGAMENTO DOS ARQUIVOS .GLB (MODELOS 3D) -->
    <a-assets>
      <a-asset-item id="modelo-braco" src="braco_robotico.glb"></a-asset-item>
      <a-asset-item id="modelo-mesa" src="mesa.gltf"></a-asset-item>
    </a-assets>

    <!-- CÂMERA E CONTROLES -->
    <a-entity id="cameraRig" position="0 0 3" nexus-movement-controller>
      <a-camera id="headCamera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="enabled: false"></a-camera>
      <a-entity id="leftHand" oculus-touch-controls="hand: left" laser-controls="hand: left"></a-entity>
      <a-entity id="rightHand" oculus-touch-controls="hand: right" laser-controls="hand: right"></a-entity>
    </a-entity>

    <!-- ILUMINAÇÃO DA SALA -->
    <a-light type="ambient" color="#0f172a" intensity="1.2"></a-light>
    <a-light type="point" position="0 4.2 1.5" color="#e0f2fe" intensity="1.8" distance="12"></a-light>
    <a-light type="point" position="0 4.2 -2.5" color="#38bdf8" intensity="1.5" distance="12"></a-light>
    <a-light type="spot" position="0 4.4 0" target="#worktable" color="#ffffff" intensity="2.5" angle="45" penumbra="0.5"></a-light>

    <!-- ESTRUTURA DO CÔMODO -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#111827" roughness="0.3" metalness="0.5"></a-plane>
    <a-grid position="0 0.01 0" width="12" height="12" cell-size="1" color-center="#06b6d4" color-grid="#1e293b"></a-grid>
    <a-plane position="0 4.8 0" rotation="90 0 0" width="12" height="12" color="#0f172a" side="double"></a-plane>

    <!-- PAREDES -->
    <a-plane position="0 2.4 -6" rotation="0 0 0" width="12" height="5" color="#1f2937"></a-plane>
    <a-plane position="0 2.4 6" rotation="0 180 0" width="12" height="5" color="#1f2937"></a-plane>
    <a-plane position="-6 2.4 0" rotation="0 90 0" width="12" height="5" color="#111827"></a-plane>
    <a-plane position="6 2.4 0" rotation="0 -90 0" width="12" height="5" color="#111827"></a-plane>

    <!-- PAINEL SENAI -->
    <a-entity position="0 2.8 -5.85">
      <a-box width="4.4" height="2.4" depth="0.1" color="#090d16"></a-box>
      <a-plane width="4.2" height="2.2" position="0 0 0.06" senai-texture-generator></a-plane>
    </a-entity>

    <!-- MESA CENTRAL COM O BRAÇO ROBÓTICO -->
    <a-entity id="worktable" position="0 0 0">
      <!-- Tampo da Mesa -->
      <a-box position="0 0.85 0" width="2.4" height="0.1" depth="1.4" color="#1e293b" roughness="0.3" metalness="0.7"></a-box>
      <a-box position="0 0.86 0" width="2.2" height="0.09" depth="1.2" color="#0f172a"></a-box>
      <a-box position="0 0.87 0" width="2.0" height="0.01" depth="0.02" color="#06b6d4" material="emissive: #06b6d4; emissiveIntensity: 0.9"></a-box>
      
      <!-- Pés da Mesa -->
      <a-box position="-1.0 0.4 -0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="1.0 0.4 -0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="-1.0 0.4 0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      <a-box position="1.0 0.4 0.5" width="0.12" height="0.8" depth="0.12" color="#334155"></a-box>
      
      <!-- MODELO 3D DA MESA (OPCIONAL/ADICIONAL) -->
      <a-gltf-model 
        src="#modelo-mesa" 
        position="0 0 0" 
        rotation="0 0 0" 
        scale="1 1 1">
      </a-gltf-model>

      <!-- BRAÇO ROBÓTICO POSITIONADO EM CIMA DA MESA -->
      <a-gltf-model 
        src="#modelo-braco" 
        position="0 0.9 0" 
        rotation="0 0 0" 
        scale="1 1 1">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
