<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const scene =
    document.querySelector("a-scene");

const player =
    document.querySelector("#player");

const intro =
    document.querySelector("#intro");

const enterVR =
    document.querySelector("#enterVR");


/* =====================================================
   ENTRAR NO VR
===================================================== */

enterVR.addEventListener(
    "click",
    async () => {

        intro.style.display =
            "none";

        try {

            await scene.enterVR();

        } catch (error) {

            console.log(
                "Erro ao iniciar VR:",
                error
            );

        }

    }
);


scene.addEventListener(
    "enter-vr",
    () => {

        intro.style.display =
            "none";

    }
);


/* =====================================================
   GAMEPADS
===================================================== */

function getGamepads() {

    if (!navigator.getGamepads) {

        return [];

    }

    return Array.from(
        navigator.getGamepads()
    ).filter(
        gamepad =>
            gamepad &&
            gamepad.connected
    );

}


/* =====================================================
   DEADZONE
===================================================== */

function deadzone(value) {

    const limit =
        0.18;

    if (
        Math.abs(value)
        < limit
    ) {

        return 0;

    }

    return value;

}


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const speed =
    0.055;

const rotationSpeed =
    0.035;

const roomLimit =
    6.15;


/* =====================================================
   MOVIMENTAÇÃO
===================================================== */

function updateMovement() {

    const gamepads =
        getGamepads();


    let left =
        null;

    let right =
        null;


    gamepads.forEach(
        gamepad => {

            if (
                gamepad.hand === "left"
            ) {

                left =
                    gamepad;

            }

            if (
                gamepad.hand === "right"
            ) {

                right =
                    gamepad;

            }

        }
    );


    /*
       Fallback para navegadores
       que não identificam a mão.
    */

    if (
        !left &&
        gamepads.length > 0
    ) {

        left =
            gamepads[0];

    }


    if (
        !right &&
        gamepads.length > 1
    ) {

        right =
            gamepads[1];

    }


    /* =================================================
       ANALÓGICO ESQUERDO
    ================================================= */

    if (left) {

        const x =
            deadzone(
                left.axes[2] ??
                left.axes[0] ??
                0
            );

        const y =
            deadzone(
                left.axes[3] ??
                left.axes[1] ??
                0
            );


        const rotation =
            player.object3D.rotation.y;


        /*
           Frente / trás
        */

        const forwardX =
            -Math.sin(rotation)
            * y
            * speed;


        const forwardZ =
            -Math.cos(rotation)
            * y
            * speed;


        /*
           Lateral
        */

        const strafeX =
            Math.cos(rotation)
            * x
            * speed;


        const strafeZ =
            -Math.sin(rotation)
            * x
            * speed;


        const newX =
            player.object3D.position.x
            +
            forwardX
            +
            strafeX;


        const newZ =
            player.object3D.position.z
            +
            forwardZ
            +
            strafeZ;


        /* =================================================
           COLISÃO COM AS PAREDES
        ================================================= */

        if (
            newX > -roomLimit &&
            newX < roomLimit
        ) {

            player.object3D.position.x =
                newX;

        }


        if (
            newZ > -roomLimit &&
            newZ < roomLimit
        ) {

            player.object3D.position.z =
                newZ;

        }

    }


    /* =================================================
       ANALÓGICO DIREITO
    ================================================= */

    if (right) {

        const rotation =
            deadzone(
                right.axes[2] ??
                right.axes[0] ??
                0
            );


        player.object3D.rotation.y -=
            rotation *
            rotationSpeed;

    }


    requestAnimationFrame(
        updateMovement
    );

}


updateMovement();


/* =====================================================
   TECLADO PARA TESTAR SEM VR
===================================================== */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[event.code] =
            true;

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[event.code] =
            false;

    }
);


function keyboardMovement() {

    let x = 0;

    let z = 0;


    if (keys["KeyW"]) {
        z -= 1;
    }

    if (keys["KeyS"]) {
        z += 1;
    }

    if (keys["KeyA"]) {
        x -= 1;
    }

    if (keys["KeyD"]) {
        x += 1;
    }


    const rotation =
        player.object3D.rotation.y;


    const newX =
        player.object3D.position.x
        +
        (
            -Math.sin(rotation) * z
            +
            Math.cos(rotation) * x
        )
        * speed;


    const newZ =
        player.object3D.position.z
        +
        (
            -Math.cos(rotation) * z
            -
            Math.sin(rotation) * x
        )
        * speed;


    if (
        newX > -roomLimit &&
        newX < roomLimit
    ) {

        player.object3D.position.x =
            newX;

    }


    if (
        newZ > -roomLimit &&
        newZ < roomLimit
    ) {

        player.object3D.position.z =
            newZ;

    }


    requestAnimationFrame(
        keyboardMovement
    );

}


keyboardMovement();


console.log(
    "NEXUS ATLAS VR iniciado."
);

</script>
