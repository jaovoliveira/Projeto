```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulação VR - TCC Mecatrônica</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Componente de movimentação -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

</head>

<body>

<a-scene>

    <!-- ================================= -->
    <!-- CÉU -->
    <!-- ================================= -->

    <a-sky color="#5DADE2"></a-sky>


    <!-- ================================= -->
    <!-- ILUMINAÇÃO -->
    <!-- ================================= -->

    <a-light
        type="ambient"
        color="#FFFFFF"
        intensity="1.5">
    </a-light>

    <a-light
        type="directional"
        position="-5 10 5"
        intensity="2">
    </a-light>


    <!-- ================================= -->
    <!-- CHÃO -->
    <!-- ================================= -->

    <a-plane
        position="0 0 0"
        rotation="-90 0 0"
        width="50"
        height="50"
        color="#4CAF50">
    </a-plane>


    <!-- ================================= -->
    <!-- OBJETOS DO CENÁRIO -->
    <!-- ================================= -->

    <a-box
        position="0 1 -5"
        width="2"
        height="2"
        depth="2"
        color="#FF5733">
    </a-box>

    <a-box
        position="5 1 -8"
        width="2"
        height="2"
        depth="2"
        color="#3498DB">
    </a-box>

    <a-box
        position="-5 1 -10"
        width="2"
        height="2"
        depth="2"
        color="#F1C40F">
    </a-box>


    <!-- ================================= -->
    <!-- CILINDROS -->
    <!-- ================================= -->

    <a-cylinder
        position="5 1 -3"
        radius="1"
        height="2"
        color="#9B59B6">
    </a-cylinder>

    <a-cylinder
        position="-5 1 -6"
        radius="1"
        height="2"
        color="#E67E22">
    </a-cylinder>


    <!-- ================================= -->
    <!-- ÁRVORES -->
    <!-- ================================= -->

    <a-cylinder
        position="8 2 -10"
        radius="0.5"
        height="4"
        color="#8B4513">
    </a-cylinder>

    <a-sphere
        position="8 4.5 -10"
        radius="2"
        color="#228B22">
    </a-sphere>


    <a-cylinder
        position="-8 2 -12"
        radius="0.5"
        height="4"
        color="#8B4513">
    </a-cylinder>

    <a-sphere
        position="-8 4.5 -12"
        radius="2"
        color="#228B22">
    </a-sphere>


    <!-- ================================= -->
    <!-- JOGADOR -->
    <!-- ================================= -->

    <a-entity
        id="player"
        position="0 0 5"
        movement-controls="speed: 0.15">

        <!-- Câmera VR -->
        <a-camera
            position="0 1.6 0">
        </a-camera>

        <!-- Controle esquerdo -->
        <a-entity
            laser-controls="hand: left">
        </a-entity>

        <!-- Controle direito -->
        <a-entity
            laser-controls="hand: right">
        </a-entity>

    </a-entity>


    <!-- ================================= -->
    <!-- BOTÃO VR -->
    <!-- ================================= -->

</a-scene>

</body>
</html>
```
