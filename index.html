<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS ATLAS - Laboratório VR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #020617;
    }

    /* ==============================
       TELA DE INTRODUÇÃO
    ============================== */

    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #0f172a 0%,
          #020617 75%
        );

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-card {
      width: min(600px, 90%);
      padding: 45px;

      text-align: center;

      background: rgba(15, 23, 42, 0.94);

      border:
        1px solid
        rgba(6, 182, 212, 0.45);

      border-radius: 20px;

      box-shadow:
        0 0 50px rgba(0, 0, 0, 0.7),
        0 0 30px rgba(6, 182, 212, 0.15);
    }

    .senai-badge {
      display: inline-block;

      padding: 6px 18px;

      margin-bottom: 20px;

      background: #005696;

      color: white;

      border-radius: 20px;

      font-weight: bold;

      letter-spacing: 2px;
    }

    h1 {
      font-size: 3rem;
      color: white;
      margin-bottom: 5px;
    }

    h2 {
      color: #38bdf8;
      font-size: 1.1rem;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    .intro-text {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    #enter-vr {
      border: none;

      padding: 17px 35px;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #005696,
          #0891b2
        );

      color: white;

      font-size: 1.05rem;

      font-weight: bold;

      cursor: pointer;

      transition: 0.25s;

      box-shadow:
        0 0 20px rgba(6, 182, 212, 0.25);
    }

    #enter-vr:hover {
      transform: scale(1.04);

      box-shadow:
        0 0 30px rgba(6, 182, 212, 0.5);
    }

    #enter-vr:active {
      transform: scale(0.98);
    }

    /* STATUS */

    #status {
      position: fixed;

      bottom: 20px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 10000;

      padding: 8px 16px;

      border-radius: 20px;

      background: rgba(0,0,0,0.7);

      color: #7dd3fc;

      font-size: 13px;

      pointer-events: none;

      transition: opacity 0.5s;
    }

    /* AVISO DO GLB */

    #model-error {
      display: none;

      position: fixed;

      left: 50%;
      top: 20px;

      transform: translateX(-50%);

      z-index: 10001;

      padding: 12px 20px;

      background: rgba(127, 29, 29, 0.95);

      color: white;

      border-radius: 10px;

      font-weight: bold;
    }
  </style>
</head>


<body>

  <!-- ==========================================
       TELA INICIAL
  =========================================== -->

  <div id="intro-screen">

    <div class="intro-card">

      <div class="senai-badge">
        SENAI
      </div>

      <h1>
        NEXUS ATLAS
      </h1>

      <h2>
        REALIDADE VIRTUAL
      </h2>

      <p class="intro-text">

        Ambiente virtual desenvolvido para o
        projeto de manipulação de um braço
        robótico através de Realidade Virtual.

        <br><br>

        Entre no laboratório para iniciar
        a experiência.

      </p>

      <button id="enter-vr">
        🥽 ENTRAR NO MODO VR
      </button>

    </div>

  </div>


  <!-- STATUS -->

  <div id="status">
    CARREGANDO AMBIENTE...
  </div>


  <!-- ERRO DO MODELO -->

  <div id="model-error">
    ⚠️ braco_robotico.glb não encontrado
  </div>


  <!-- ==========================================
       CENA VR
  =========================================== -->

  <a-scene

    renderer="
      antialias: true;
      colorManagement: true;
      exposure: 1.1;
      toneMapping: ACESFilmic;
    "

    vr-mode-ui="enabled: true"

    loading-screen="enabled: false"

  >


    <!-- ========================================
         ASSETS
    ========================================= -->

    <!--
      IMPORTANTE:

      NÃO colocamos o GLB aqui.

      Dessa forma o GLB não impede a cena
      de abrir.
    -->

    <a-assets timeout="3000">
    </a-assets>


    <!-- ========================================
         ILUMINAÇÃO
    ========================================= -->

    <a-light
      type="ambient"
      color="#dbeafe"
      intensity="0.7">
    </a-light>


    <a-light
      type="directional"
      position="-3 6 2"
      color="#ffffff"
      intensity="1.5"
      cast-shadow="true">
    </a-light>


    <!-- LUZ CENTRAL -->

    <a-light
      type="point"
      position="0 3.8 0"
      color="#ffffff"
      intensity="2"
      distance="8">
    </a-light>


    <!-- ========================================
         CHÃO
    ========================================= -->

    <a-plane

      rotation="-90 0 0"

      width="10"
      height="10"

      color="#111827"

      material="
        roughness: 0.75;
        metalness: 0.2;
      "

      shadow="receive: true"

    >
    </a-plane>


    <!-- ========================================
         PAREDES
    ========================================= -->

    <!-- PAREDE TRASEIRA -->

    <a-box

      position="0 2 -4"

      width="8"
      height="4"
      depth="0.2"

      color="#1e293b"

      shadow="receive: true"

    >
    </a-box>


    <!-- PAREDE ESQUERDA -->

    <a-box

      position="-4 2 0"

      width="0.2"
      height="4"
      depth="8"

      color="#1e293b"

    >
    </a-box>


    <!-- PAREDE DIREITA -->

    <a-box

      position="4 2 0"

      width="0.2"
      height="4"
      depth="8"

      color="#1e293b"

    >
    </a-box>


    <!-- PAREDE FRONTAL -->

    <a-box

      position="0 2 4"

      width="8"
      height="4"
      depth="0.2"

      color="#1e293b"

    >
    </a-box>


    <!-- ========================================
         TETO
    ========================================= -->

    <a-box

      position="0 4 0"

      width="8"
      height="0.2"
      depth="8"

      color="#0f172a"

    >
    </a-box>


    <!-- ========================================
         LÂMPADAS
    ========================================= -->

    <a-box
      position="-2 3.9 0"
      width="0.8"
      height="0.05"
      depth="0.25"
      color="#ffffff"
      material="
        emissive: #ffffff;
        emissiveIntensity: 3;
      ">
    </a-box>


    <a-box
      position="0 3.9 0"
      width="0.8"
      height="0.05"
      depth="0.25"
      color="#ffffff"
      material="
        emissive: #ffffff;
        emissiveIntensity: 3;
      ">
    </a-box>


    <a-box
      position="2 3.9 0"
      width="0.8"
      height="0.05"
      depth="0.25"
      color="#ffffff"
      material="
        emissive: #ffffff;
        emissiveIntensity: 3;
      ">
    </a-box>


    <!-- ========================================
         LOGO / PAINEL SENAI
    ========================================= -->

    <a-box

      position="0 2.3 -3.85"

      width="3.2"
      height="1.35"
      depth="0.08"

      color="#005696"

      material="
        roughness: 0.3;
        metalness: 0.3;
      "

    >
    </a-box>


    <a-text

      value="SENAI"

      align="center"

      width="5"

      color="#ffffff"

      position="0 2.35 -3.79"

    >
    </a-text>


    <a-text

      value="LABORATÓRIO DE REALIDADE VIRTUAL"

      align="center"

      width="3"

      color="#7dd3fc"

      position="0 1.8 -3.78"

    >
    </a-text>


    <!-- ========================================
         MESA
    ========================================= -->

    <a-entity id="worktable">


      <!-- TAMPO -->

      <a-box

        position="0 0.95 0"

        width="3.4"

        height="0.16"

        depth="2"

        color="#1e293b"

        material="
          roughness: 0.28;
          metalness: 0.72;
        "

        shadow="
          cast: true;
          receive: true;
        "

      >
      </a-box>


      <!-- SUPERFÍCIE -->

      <a-box

        position="0 1.045 0"

        width="3.15"

        height="0.035"

        depth="1.75"

        color="#080f1d"

        material="
          roughness: 0.2;
          metalness: 0.5;
        "

      >
      </a-box>


      <!-- BORDA AZUL -->

      <a-box

        position="0 1.07 -0.87"

        width="3.05"

        height="0.025"

        depth="0.035"

        color="#06b6d4"

        material="
          emissive: #06b6d4;
          emissiveIntensity: 2;
        "

      >
      </a-box>


      <!-- PÉS -->

      <a-box
        position="-1.45 0.47 -0.75"
        width="0.16"
        height="0.9"
        depth="0.16"
        color="#334155">
      </a-box>


      <a-box
        position="1.45 0.47 -0.75"
        width="0.16"
        height="0.9"
        depth="0.16"
        color="#334155">
      </a-box>


      <a-box
        position="-1.45 0.47 0.75"
        width="0.16"
        height="0.9"
        depth="0.16"
        color="#334155">
      </a-box>


      <a-box
        position="1.45 0.47 0.75"
        width="0.16"
        height="0.9"
        depth="0.16"
        color="#334155">
      </a-box>


      <!-- =====================================
           BASE DO BRAÇO
      ====================================== -->

      <a-cylinder

        position="0 1.12 0"

        radius="0.48"

        height="0.12"

        color="#111827"

        material="
          roughness: 0.25;
          metalness: 0.85;
        "

        shadow="cast: true"

      >
      </a-cylinder>


      <!-- ANEL DA BASE -->

      <a-torus

        position="0 1.19 0"

        rotation="90 0 0"

        radius="0.38"

        radius-tubular="0.02"

        color="#06b6d4"

        material="
          emissive: #06b6d4;
          emissiveIntensity: 2;
        "

      >
      </a-torus>


      <!-- =====================================
           BRAÇO ROBÓTICO
      ====================================== -->

      <!--
        IMPORTANTE:

        O arquivo precisa estar exatamente assim:

        braco_robotico.glb

        e na mesma pasta deste index.html.
      -->

      <a-gltf-model

        id="robot-arm"

        src="braco_robotico.glb"

        position="0 1.2 0"

        rotation="0 180 0"

        scale="0.78 0.78 0.78"

        shadow="
          cast: true;
          receive: true;
        "

      >
      </a-gltf-model>


      <!-- LUZ DO BRAÇO -->

      <a-light

        type="spot"

        position="0 3.8 0.5"

        target="#robot-arm"

        color="#ffffff"

        intensity="3"

        angle="35"

        penumbra="0.6"

        distance="7"

        cast-shadow="true"

      >
      </a-light>


      <!-- IDENTIFICAÇÃO -->

      <a-text

        value="NEXUS ATLAS • ROBOT ARM"

        align="center"

        width="3"

        color="#7dd3fc"

        position="0 1.42 -1.02"

      >
      </a-text>


    </a-entity>


    <!-- ========================================
         CÂMERA / CONTROLES
    ========================================= -->

    <a-entity

      id="rig"

      position="0 1.7 2.7"

    >

      <a-camera

        look-controls="enabled: true"

        wasd-controls="
          enabled: true;
          acceleration: 8;
        "

      >
      </a-camera>


      <!-- CONTROLE ESQUERDO -->

      <a-entity

        id="left-hand"

        laser-controls="hand: left"

        oculus-touch-controls="hand: left"

      >
      </a-entity>


      <!-- CONTROLE DIREITO -->

      <a-entity

        id="right-hand"

        laser-controls="hand: right"

        oculus-touch-controls="hand: right"

      >
      </a-entity>


    </a-entity>


  </a-scene>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script>

    const intro =
      document.getElementById("intro-screen");

    const button =
      document.getElementById("enter-vr");

    const status =
      document.getElementById("status");

    const errorBox =
      document.getElementById("model-error");

    const scene =
      document.querySelector("a-scene");

    const robot =
      document.getElementById("robot-arm");


    /* =========================================
       ENTRAR
    ========================================= */

    button.addEventListener(
      "click",
      async function () {

        /*
          IMPORTANTE:

          A tela desaparece imediatamente.

          Não esperamos o GLB.
        */

        intro.classList.add("hidden");

        status.textContent =
          "ENTRANDO NO AMBIENTE...";


        /*
          Tenta entrar no VR.

          Se não houver VR disponível,
          o ambiente continua funcionando
          normalmente no computador.
        */

        if (
          scene &&
          scene.enterVR &&
          navigator.xr
        ) {

          try {

            await scene.enterVR();

          } catch (error) {

            console.warn(
              "VR não disponível:",
              error
            );

          }

        }


        status.textContent =
          "NEXUS ATLAS • AMBIENTE PRONTO";


        setTimeout(() => {

          status.style.opacity = "0";

        }, 1500);

      }
    );


    /* =========================================
       VERIFICAR BRAÇO
    ========================================= */

    robot.addEventListener(
      "model-loaded",
      function () {

        console.log(
          "NEXUS ATLAS: braço carregado!"
        );


        /*
          Calculamos a caixa do modelo.

          Isso permite posicionar a parte
          inferior do braço sobre a mesa.
        */

        const model =
          robot.getObject3D("mesh");

        if (!model) return;


        model.updateMatrixWorld(true);


        const box =
          new THREE.Box3()
            .setFromObject(model);


        /*
          Altura desejada do tampo.
        */

        const mesa =
          1.20;


        /*
          Corrige a altura automaticamente.
        */

        robot.object3D.position.y +=
          mesa - box.min.y;


        console.log(
          "Braço posicionado sobre a mesa."
        );

      }
    );


    /* =========================================
       ERRO DO GLB
    ========================================= */

    robot.addEventListener(
      "model-error",
      function (event) {

        console.error(
          "Erro ao carregar o braço:",
          event
        );


        errorBox.style.display =
          "block";


        status.textContent =
          "LOBBY PRONTO • BRAÇO 3D NÃO ENCONTRADO";

      }
    );


    /* =========================================
       CENA
    ========================================= */

    scene.addEventListener(
      "loaded",
      function () {

        status.textContent =
          "AMBIENTE 3D PRONTO";

        console.log(
          "NEXUS ATLAS carregado."
        );

      }
    );


  </script>

</body>
</html>
